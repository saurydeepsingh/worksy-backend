spring.application.name=worksy-backend

# ================= SERVER =================
server.port=8080

# ================= DATABASE =================
spring.datasource.url=jdbc:mysql://localhost:3306/worksy_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:17AUGUST2005}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================= JPA / HIBERNATE =================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ================= JWT =================
# In production set JWT_SECRET as an environment variable (min 256-bit / 32+ chars, base64 recommended)
app.jwt.secret=${JWT_SECRET:c2hoaHNoaHNoaHNoaHNoaHNoc2hoc2hoc2hoc2hoc2hoc2hvcmtzeXNlY3JldGtleQ==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ================= CORS =================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ================= FILE UPLOAD =================
app.file.upload-dir=${UPLOAD_DIR:./uploads/resumes}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ================= MAIL =================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:noreply@worksy.com}

# ================= SWAGGER =================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ================= LOGGING =================
logging.level.com.worksy=INFO
logging.level.org.springframework.security=WARN

# ================= SAMPLE DATA =================
app.data.seed=${SEED_DATA:true}
